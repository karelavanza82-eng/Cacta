name: Build Cacta APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Also run unit tests (does not block the APK build)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;28.2.13676358"

      # llama.cpp and proot are git submodules upstream. If they are missing in this
      # repository, fetch the exact commits pinned by the upstream project.
      - name: Fetch third-party sources (llama.cpp, proot)
        run: |
          need_llama=false; need_proot=false
          [ -f thirdparty/llama.cpp/CMakeLists.txt ] || need_llama=true
          [ -n "$(ls -A thirdparty/proot 2>/dev/null)" ] || need_proot=true
          if $need_llama || $need_proot; then
            git clone --depth 1 https://github.com/newo-ether/Agora.git "$RUNNER_TEMP/upstream"
            fetch_at() { # dir url sha
              mkdir -p "$1"; git -C "$1" init -q
              git -C "$1" remote add origin "$2"
              git -C "$1" fetch --depth 1 origin "$3"
              git -C "$1" checkout -q FETCH_HEAD
            }
            if $need_llama; then
              sha=$(git -C "$RUNNER_TEMP/upstream" ls-tree HEAD thirdparty/llama.cpp | awk '{print $3}')
              fetch_at thirdparty/llama.cpp https://github.com/ggml-org/llama.cpp.git "$sha"
            fi
            if $need_proot; then
              sha=$(git -C "$RUNNER_TEMP/upstream" ls-tree HEAD thirdparty/proot | awk '{print $3}')
              fetch_at thirdparty/proot https://github.com/termux/proot.git "$sha"
            fi
          fi

      # Optional: only used if you add the KEYSTORE_* secrets. Otherwise the APK is
      # signed with the debug key (installable, but not for Play Store).
      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"
          cat >> local.properties <<EOF2
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      - uses: gradle/actions/setup-gradle@v4

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cacta-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error

  tests:
    name: Unit tests (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x ./gradlew
          ./gradlew :app:testFdroidDebugUnitTest --no-daemon --stacktrace
          
